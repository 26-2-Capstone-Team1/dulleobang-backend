[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dulleobang-backend"
version = "1.1.0"
description = "둘러방 API v1.1 backend and AI worker integration"
requires-python = ">=3.11"
dependencies = ["fastapi==0.135.2", "uvicorn==0.41.0", "jsonschema==4.26.0", "PyJWT==2.12.1", "argon2-cffi==25.1.0", "Pillow==12.1.1", "rfc8785==0.1.4", "cryptography==46.0.5", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.15.7", "coverage==7.16.2"]
worker = ["httpx==0.28.1"]

[project.scripts]
dulleobang = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["contract/*.json", "contract/*.md", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

