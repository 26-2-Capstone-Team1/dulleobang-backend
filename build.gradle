plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.dulleobang'
version = '2.0.0-p7'
// Java 21's Windows launcher reads @argfiles in the native charset. Keep worker
// classpaths ASCII when a checkout contains Korean characters.
if (System.getProperty('os.name').startsWith('Windows') && !projectDir.absolutePath.chars().allMatch { it < 128 }) {
    layout.buildDirectory = file(providers.environmentVariable('V2_BUILD_DIR').getOrElse(
        new File(System.getProperty('java.io.tmpdir'), 'dulleobang-v2-build-' + Integer.toHexString(projectDir.absolutePath.hashCode())).absolutePath))
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
configurations { formatter }
dependencies {
    formatter 'com.google.googlejavaformat:google-java-format:1.33.0:all-deps'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.9.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    implementation 'io.github.erdtman:java-json-canonicalization:1.1'
    implementation 'com.networknt:json-schema-validator:1.5.9'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
    testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:17.11.0')
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '768m'
    systemProperty 'java.awt.headless', 'true'
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
    reports.junitXml.outputLocation = layout.projectDirectory.dir('verification/junit')
    reports.html.outputLocation = layout.projectDirectory.dir('verification/java-tests')
}
dependencyLocking { lockAllConfigurations() }

tasks.register('localRun', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dulleobang.LocalDevelopmentLauncher'
}
['formatJava': ['--replace'], 'checkFormat': ['--dry-run','--set-exit-if-changed']].each { taskName, flags ->
    tasks.register(taskName, JavaExec) {
        classpath = configurations.formatter
        mainClass = 'com.google.googlejavaformat.java.Main'
        args flags
        args fileTree('src') { include '**/*.java' }.files.sort().collect { relativePath(it) }
        jvmArgs '--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
    }
}
tasks.named('compileJava') { mustRunAfter tasks.named('formatJava') }
tasks.named('compileTestJava') { mustRunAfter tasks.named('formatJava') }
