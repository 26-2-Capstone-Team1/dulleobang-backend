plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.dulleobang'
version = '2.0.0-p7'
// Java 21's Windows launcher reads @argfiles in the native charset. Keep worker
// classpaths ASCII when a checkout contains Korean characters.
if (System.getProperty('os.name').startsWith('Windows') && !projectDir.absolutePath.chars().allMatch { it < 128 }) {
    layout.buildDirectory = file(providers.environmentVariable('V2_BUILD_DIR').getOrElse(
        new File(System.getProperty('java.io.tmpdir'), 'dulleobang-v2-build-' + Integer.toHexString(projectDir.absolutePath.hashCode())).absolutePath))
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.9.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    implementation 'io.github.erdtman:java-json-canonicalization:1.1'
    implementation 'com.networknt:json-schema-validator:1.5.9'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
dependencyLocking { lockAllConfigurations() }
