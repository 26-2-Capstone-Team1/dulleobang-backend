name: v2-backend
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install -r legacy-baseline/requirements.lock
      - run: python scripts/verify-inventory.py
      - run: python scripts/test-migration-preflight.py
      - run: python scripts/check-contract-files.py
      - run: python scripts/run-legacy-contracts.py
      - run: bash gradlew checkFormat test bootJar --no-daemon
      - run: python -m pytest tests -q -p no:cacheprovider --junitxml=../verification/legacy-junit.xml
        working-directory: legacy-baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: verification/
