services:
  postgres:
    image: postgres:17.11
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: dulleobang_v2
      POSTGRES_USER: dulleobang
      POSTGRES_PASSWORD: local-v2-only
    volumes:
      - v2-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dulleobang -d dulleobang_v2"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  v2-postgres:
